<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="TV Energy Consumption D3 Visualisation">

    <title>TV Energy Consumption</title>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/visualisation.css">

</head>


<body>

    <header>

        <h1>TV Energy Consumption</h1>

        <p>
            Explore television energy consumption using an
            interactive histogram.
        </p>

    </header>


    <main>

        <!-- Filters -->
        <section class="controls">

            <h2>Screen Technology</h2>

            <div id="filters_screen"></div>

        </section>


        <!-- Histogram -->
        <section class="chart-section">

            <h2>Energy Consumption Histogram</h2>

            <p>
                The histogram shows the frequency of television
                energy consumption.
            </p>

            <div id="histogram"
                 class="responsive-svg-container">
            </div>

            <h3>TV Energy Consumption by Star Rating</h3>

            <div id="scatterplot" class="responsive-svg-container"></div>   

        </section>

        

    </main>


    <footer>

        <p>
            Appliance Energy Consumption Website
        </p>

    </footer>


    <!-- D3 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- JavaScript files -->
    <script src="assets/js/load-data.js"></script>
    <script src="assets/js/shared-constants.js"></script>
    <script src="assets/js/interactions.js"></script>
    <script src="assets/js/histogram.js"></script>
    <script src="assets/js/scatterplot.js"></script>

</body>

</html>
